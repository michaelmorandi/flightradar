[project]
name = "flightradar"
version = "1.5.4"
description = "Flightradar is a Python backend for tracking and managing flight data."
requires-python = ">=3.15"
dependencies = [
    "apscheduler==3.11.3",
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "pymongo==4.18.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.5",
    "requests==2.33.0",
    "typer==0.27.3",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.2",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "slowapi==0.1.9",
    "fastapi-users[beanie]==15.0.3",
    "beanie>=1.25.0",
    "motor>=3.3.0"
]

[dependency-groups]
dev = [
    "requests-mock==1.8.0",
    "pytest==9.0.3",
    "pytest-cov==6.0.0"
]
